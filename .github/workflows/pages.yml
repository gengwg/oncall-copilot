name: pages

on:
  push:
    branches: [main]
    paths: [deploy/dashboard/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # git does not keep mtimes; the dashboard sorts and labels reports by them
      - run: |
          for f in deploy/dashboard/incidents/*.md; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/dashboard/go.mod
      - run: cd deploy/dashboard && go run . -incidents incidents -render ../../_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
