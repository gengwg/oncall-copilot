# grafana/alloy values: collect pod logs from the demo namespace -> Loki.
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "demo" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex = "demo"
          action = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
      }

      loki.source.kubernetes "demo" {
        targets    = discovery.relabel.demo.output
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.observability.svc:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

# no metrics needed from alloy itself for the demo
